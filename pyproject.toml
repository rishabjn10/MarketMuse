[project]
name = "market_muse"
version = "0.1.0"
description = "marketing-posts using crewAI"
authors = [
    { name = "Your Name", email = "you@example.com" },
]
requires-python = ">=3.10,<=3.13"
dependencies = [
    "crewai[tools]==0.85.0",
    "crewai-tools>=0.4.6",
    "langchain (>=0.3.23,<0.4.0)",
    "groq (>=0.22.0,<0.23.0)",
    "langchain-groq (>=0.3.2,<0.4.0)",
    "python-dotenv (>=1.1.0,<2.0.0)",
]

[project.scripts]
market_muse = "market_muse.main:run"
run_crew = "market_muse.main:run"

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"
